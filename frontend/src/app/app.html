<router-outlet></router-outlet>

<!-- Toast Global Animado -->
<div class="global-toast-container" *ngIf="notificationService.toastState() as toast" [class.show]="toast.show" [class.error]="toast.type === 'error'">
  <div class="toast-content glass-panel">
    <span class="toast-icon">{{ toast.type === 'success' ? '✅' : '⚠️' }}</span>
    <span class="toast-message">{{ toast.message }}</span>
    <button class="toast-close" (click)="notificationService.closeToast()">×</button>
  </div>
</div>

<!-- Modal de Confirmación Global Animado -->
<div class="global-confirm-overlay" *ngIf="notificationService.confirmState() as confirm" [class.show]="confirm.show">
  <div class="global-confirm-backdrop" (click)="notificationService.closeConfirm()"></div>
  <div class="confirm-content glass-panel">
    <h3>{{ confirm.title }}</h3>
    <p>{{ confirm.message }}</p>
    <div class="confirm-actions">
      <button class="btn-cancel" (click)="notificationService.closeConfirm()">Cancelar</button>
      <button class="btn-confirm-action" (click)="confirm.onConfirm()">Confirmar</button>
    </div>
  </div>
</div>
